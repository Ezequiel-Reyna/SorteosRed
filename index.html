<title>Sorteador de Reels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una sola columna vertical pensada para grabar la pantalla del celular.
   Logo arriba y escenario negro del sorteo al centro (la lista de comentarios pasa y frena en el ganador).
   Fondo claro cálido para que el logo amarillo y negro resalte. */
:root {
  --bg: #fffdf0;
  --bg2: #fff9d6;
  --surface: #ffffff;
  --line: #e8dd9a;
  --fg: #121212;
  --muted: #6b6540;
  --brand: #121212;
  --green: #121212;
  --accent: #ffe500;
  --accent-ink: #121212;
  --stage: #121212;
  --stage-fg: #fffbe0;
  --stage-muted: #b8b28a;
  --stage-line: #3a3a3a;
  --danger: #c0301f;
  --ok: #1c7f55;
  --warn: #8f5a00;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --row: 60px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: linear-gradient(180deg, #000000 0, #000222 300px);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* Marca */
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.logo-top { height: 120px; display: flex; align-items: center; justify-content: center; }
.logo-top img { max-height: 120px; max-width: 220px; object-fit: contain; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(30px, 9vw, 42px);
  line-height: .95;
  letter-spacing: .02em;
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--fg);
}
h1 span { background: var(--accent); color: var(--fg); padding: 0 .18em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* Panel de carga */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(18, 18, 18, .08); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="url"], input[type="number"], textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 10px;
  padding: 11px 12px;
  font: inherit;
  font-size: 16px;
}
textarea { resize: vertical; min-height: 120px; line-height: 1.35; }
::placeholder { color: #9a9470; }
.hint { font-size: 13px; color: var(--muted); min-height: 1em; }
.hint.ok { color: var(--ok); }
.hint.warn { color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 16px; border-radius: 12px;
  font: inherit; font-weight: 800; cursor: pointer;
  border: 1px solid transparent; color: var(--fg); background: transparent;
}
.btn-sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn-ghost { border-color: var(--line); background: var(--surface); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: #121212; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.msg { font-size: 14px; min-height: 1em; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--danger); }

/* Escenario */
.meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.pill { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stage { position: relative; height: calc(var(--row) * 5); overflow: hidden; border-radius: 16px; background: var(--stage); box-shadow: 0 10px 28px rgba(18, 18, 18, .35); }
.reel { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%, #000 76%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 24%, #000 76%, transparent 100%); }
.row { height: var(--row); padding: 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 3px; opacity: .45; color: var(--stage-fg); }
.row:nth-child(2), .row:nth-child(4) { opacity: .75; }
.row:nth-child(3) { opacity: 1; }
.row .u { font-family: var(--font-display); font-weight: 800; font-size: 25px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t { font-size: 13px; color: var(--stage-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.ghost .u::before, .row.ghost .t::before { content: ""; display: block; height: 12px; border-radius: 6px; background: var(--stage-line); }
.row.ghost .u::before { width: 42%; }
.row.ghost .t::before { width: 72%; margin-top: 8px; height: 9px; }
.frame { position: absolute; left: 10px; right: 10px; top: calc(var(--row) * 2); height: var(--row); border-radius: 12px; border: 2px solid var(--accent); pointer-events: none; box-shadow: 0 0 22px rgba(255, 229, 0, .35); }
.stage.won .frame { animation: pulse .6s ease-in-out 3; }
.idle { position: absolute; left: 10px; right: 10px; top: calc(var(--row) * 2); height: var(--row); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; background: var(--stage); border-radius: 12px; font-weight: 700; color: var(--stage-muted); }
.reveal { position: absolute; inset: 0; background: var(--accent); color: var(--accent-ink); padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 8px; animation: revealIn .45s cubic-bezier(.2, .9, .3, 1.1); }
.r-tag { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
.r-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(44px, 14vw, 66px); line-height: .95; overflow-wrap: anywhere; }
.r-text { font-size: 15px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.r-reel { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
@keyframes pulse { 50% { box-shadow: 0 0 34px rgba(255, 229, 0, .95); } }
@keyframes revealIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }

.controls { display: flex; flex-direction: column; gap: 10px; }
.btn-draw { min-height: 62px; font-family: var(--font-display); font-size: 30px; letter-spacing: .05em; text-transform: uppercase; }
.sub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log-item { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.log-item { border-left: 6px solid var(--accent); }
.log-item .lt { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.log-item .ln { font-family: var(--font-display); font-weight: 800; font-size: 22px; overflow-wrap: anywhere; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="brand">
    <div class="logo-top" data-slot="mic"></div>
    <h1>Sorteo de <span>comentarios</span></h1>
  </header>

  <section class="panel" id="setup">
    <div class="field">
      <label for="reelUrl">Link del reel</label>
      <input id="reelUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.instagram.com/reel/...">
      <div class="hint" id="reelHint"></div>
    </div>

    <div class="field">
      <label for="pasteBox">Comentarios</label>
      <textarea id="pasteBox" spellcheck="false" placeholder="Un comentario por línea, con este formato:&#10;usuario: texto del comentario"></textarea>
      <div class="actions">
        <label class="btn btn-ghost btn-sm" for="fileIn">Subir archivo (.csv, .json, .txt)</label>
        <input id="fileIn" type="file" accept=".csv,.tsv,.json,.txt,text/plain,text/csv,application/json" hidden>
        <button type="button" class="btn btn-ghost btn-sm" id="btnExample">Probar con ejemplo</button>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="nWin">Ganadores</label>
        <input id="nWin" type="number" inputmode="numeric" min="1" max="5" value="1">
      </div>
      <div class="field">
        <label for="nSub">Suplentes</label>
        <input id="nSub" type="number" inputmode="numeric" min="0" max="3" value="0">
      </div>
    </div>
    <div class="field">
      <label for="excl">Cuentas a excluir (opcional)</label>
      <input id="excl" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ej: micuenta, otracuenta">
    </div>
    <label class="check"><input type="checkbox" id="uniq" checked> Una participación por usuario</label>


    <button type="button" class="btn btn-primary" id="btnLoad">Preparar sorteo</button>
    <div class="msg" id="loadMsg" role="status"></div>
  </section>

  <section class="controls-wrap" style="display:flex;flex-direction:column;gap:12px">
    <div class="meta">
      <span class="pill">Reel <b id="pReel">sin link</b></span>
      <span class="pill"><b id="pCount">0</b> participantes</span>
    </div>

    <div class="stage" id="stage">
      <div class="reel"><div id="rows"></div></div>
      <div class="frame" aria-hidden="true"></div>
      <div class="idle" id="idle">Cargá los comentarios para empezar</div>
      <div class="reveal" id="reveal" role="status" hidden>
        <div class="r-tag" id="rTag"></div>
        <div class="r-name" id="rName"></div>
        <div class="r-text" id="rText"></div>
        <div class="r-reel" id="rReel"></div>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn btn-primary btn-draw" id="btnDraw" disabled>Cargá los comentarios</button>
      <div class="sub-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnSound" aria-pressed="true">Sonido activado</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnEdit">Editar datos</button>
      </div>
    </div>

    <div class="log" id="winLog" aria-live="polite"></div>
  </section>

</div>

  function cleanUser(u) { return String(u == null ? '' : u).trim().replace(/^@/, ''); }

    return m ? m[1] : null;

      if (m) out.push({ user: m[1], text: m[2].trim() });
      else out.push({ user: '', text: line });
    });
    return out;
  }

  function parseCSV(text) {
    var first = text.split(/\r?\n/, 1)[0] || '';
    var delim = [',', ';', '\t'].map(function (d) { return [d, first.split(d).length]; }).sort(function (a, b) { return b[1] - a[1]; })[0][0];
    var rows = [], row = [], cur = '', q = false;

        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {

        row.push(cur); cur = '';
        if (row.some(function (c) { return c.trim() !== ''; })) rows.push(row);

      } else cur += ch;

    row.push(cur);

    var ui = head.findIndex(function (h) { return /^(username|user name|owner ?username|user|usuario|author|owner|from|nombre de usuario)/.test(h); });

    if (ti < 0) ti = head.findIndex(function (h) { return /text|comment|coment|message|mensaje|content/.test(h); });
    var body;

    else { ui = 0; ti = rows[0].length > 1 ? 1 : -1; body = rows; }
    return body.map(function (r) {
      return { user: ui >= 0 ? cleanUser(r[ui]) : '', text: String(ti >= 0 ? (r[ti] || '') : '').trim() };
    });
  }

  function fromJSON(txt) {
    var d = JSON.parse(txt);
    if (!Array.isArray(d)) {
      var k = Object.keys(d || {}).find(function (key) { return Array.isArray(d[key]); });
      d = k ? d[k] : [];

      for (var i = 0; i < keys.length; i++) {

        if (v != null && v !== '') return typeof v === 'object' ? (v.username || v.userName || v.name || '') : String(v);
      }
      return '';
    }

      if (typeof o === 'string') return { user: '', text: o.trim() };

        user: cleanUser(pick(o, ['ownerUsername', 'username', 'userName', 'user', 'author', 'owner', 'from', 'Username', 'User'])),
        text: String(pick(o, ['text', 'comment', 'message', 'content', 'Comment', 'Text'])).trim()
      };
    });
  }

    });
    return pool;

  /* Mensajes y link */
  function setMsg(t, kind) { var m = $('loadMsg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function updateHint() {
    var v = $('reelUrl').value.trim(), h = $('reelHint');
    if (!v) { h.textContent = ''; h.className = 'hint'; return; }
    var code = parseReel(v);
    if (code) { h.textContent = 'Reel detectado: ' + code; h.className = 'hint ok'; }
    else { h.textContent = 'No parece un link de reel de Instagram. Podés sortear igual.'; h.className = 'hint warn'; }
  }
  $('reelUrl').addEventListener('input', updateHint);

  /* Carga de comentarios */
  var EX = [
    'luciana.ferreyra: Quiero ganar! Escucho la radio todos los días',
    'mati_cba: Participo con mi vieja que es fanática del programa',
    'sofi.rodriguez22: Vamos que se puede!!',
    'carlitos.peralta: Yo, yo, yo!',
    'valen_gomez: Ojalá me toque, gracias por los sorteos',
    'nico.sosa: Participando desde el barrio',
    'ana.belen.m: Me anoto, qué lindo premio',
    'lucho_fernandez: Siempre escuchando, nunca ganando. Hoy es el día',
    'mati_cba: Participo de nuevo por si acaso',
    'cami.ortiz: Gracias por tanto, vamos radio',
    'fede.bustos: A ver si esta vez sale',
    'rochi_diaz: Compartido con mis amigas'
  ];
  $('btnExample').addEventListener('click', function () {
    $('reelUrl').value = 'https://www.instagram.com/reel/EJEMPLO123/';
    $('pasteBox').value = EX.join('\n');
    updateHint();
    setMsg('Cargué datos de ejemplo. Reemplazalos por los del sorteo real.', 'ok');
  });
  $('fileIn').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      var t = txt.replace(/^﻿/, ''), name = f.name.toLowerCase(), entries, s = t.trim();
      if (/\.json$/.test(name) || s[0] === '[' || s[0] === '{') entries = fromJSON(s);
      else if (/\.(csv|tsv)$/.test(name)) entries = fromRows(parseCSV(t));
      else entries = parseLines(t);
      $('pasteBox').value = entries.map(function (en, i) {
        var u = (en.user || '').replace(/\s+/g, '_') || ('participante' + (i + 1));
        return u + ': ' + (en.text || '').replace(/\s*[\r\n]+\s*/g, ' ');
      }).join('\n');
      setMsg('Archivo leído: ' + entries.length + ' comentarios.', 'ok');
    }).catch(function () { setMsg('No pude leer ese archivo. Probá con un .csv, .json o .txt.', 'err'); });
    e.target.value = '';
  });

  /* Escenario */
  var rowsEl = $('rows');
  for (var i = 0; i < 5; i++) {
    var r = document.createElement('div'); r.className = 'row ghost';
    r.innerHTML = '<div class="u"></div><div class="t"></div>';
    rowsEl.appendChild(r);
  }
  function label(it) { return it.user ? '@' + it.user : 'Participante #' + it.n; }
  function setRows(items) {
    for (var i = 0; i < 5; i++) {
      var it = items[i], r = rowsEl.children[i];
      r.classList.toggle('ghost', !it);
      r.querySelector('.u').textContent = it ? label(it) : '';
      r.querySelector('.t').textContent = it ? (it.text || '(sin texto)') : '';
    }
  }
  function randInt(n) {
    if (n <= 1) return 0;
    try {
      var a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n, x;
      do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
      return x % n;
    } catch (e) { return Math.floor(Math.random() * n); }
  }
  function previewRows() {
    var m = S.pool.length, sh = S.pool.slice();
    for (var i = sh.length - 1; i > 0; i--) { var j = randInt(i + 1), t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
    var items = []; for (var k = 0; k < 5; k++) items.push(m ? sh[k % m] : null);
    setRows(items);
  }
  function idleState() { setRows([]); $('idle').hidden = false; }

  function drawLabel(k) {
    if (k < S.nWin) return S.nWin > 1 ? 'Sortear ganador/a ' + (k + 1) + ' de ' + S.nWin : 'Sortear';
    var j = k - S.nWin + 1;
    return S.nSub > 1 ? 'Sortear suplente ' + j + ' de ' + S.nSub : 'Sortear suplente';
  }
  function updateButton() {
    var b = $('btnDraw');
    if (!S.pool.length) { b.textContent = 'Cargá los comentarios'; b.disabled = true; b.dataset.mode = ''; return; }
    if (S.running) { b.textContent = 'Sorteando…'; b.disabled = true; return; }
    b.disabled = false;
    if (S.winners.length >= S.total) { b.textContent = 'Nuevo sorteo'; b.dataset.mode = 'reset'; }
    else { b.textContent = drawLabel(S.winners.length); b.dataset.mode = 'draw'; }
  }

  $('btnLoad').addEventListener('click', function () {
    var entries = parseLines($('pasteBox').value);
    var excl = new Set($('excl').value.split(/[\s,;]+/).map(function (s) { return s.replace(/^@/, '').toLowerCase(); }).filter(Boolean));
    var pool = buildPool(entries, $('uniq').checked, excl);
    var nWin = Math.min(5, Math.max(1, parseInt($('nWin').value, 10) || 1));
    var nSub = Math.min(3, Math.max(0, parseInt($('nSub').value, 10) || 0));
    if (!pool.length) { setMsg('Pegá o subí los comentarios para poder sortear.', 'err'); return; }
    if (nWin + nSub > pool.length) { setMsg('Hay ' + pool.length + ' participantes y pediste ' + (nWin + nSub) + ' lugares. Bajá los ganadores o suplentes.', 'err'); return; }
    S.pool = pool; S.winners = []; S.nWin = nWin; S.nSub = nSub; S.total = nWin + nSub; S.running = false;
    S.reel = parseReel($('reelUrl').value) || '';
    $('pReel').textContent = S.reel || 'sin link';
    $('pCount').textContent = pool.length;
    $('reveal').hidden = true; $('winLog').textContent = '';
    $('stage').classList.remove('won');
    $('idle').hidden = true; previewRows(); updateButton();
    setMsg(entries.length + ' comentarios leídos, ' + pool.length + ' participantes.', 'ok');
    $('setup').hidden = true;
    try { $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  });
  $('btnEdit').addEventListener('click', function () {
    if (S.running) return;
    $('setup').hidden = false;
    try { $('setup').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
  });

  function newRaffle() {
    S.pool = []; S.winners = []; S.running = false; S.reel = '';
    $('reelUrl').value = ''; $('pasteBox').value = ''; updateHint(); setMsg('');
    $('pReel').textContent = 'sin link'; $('pCount').textContent = '0';
    $('reveal').hidden = true; $('winLog').textContent = ''; $('stage').classList.remove('won');
    idleState(); updateButton();
    $('setup').hidden = false;
    try { $('setup').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
  }

  /* Sonido */
  var AC = null;
  function initAudio() {
    if (!S.sound) return;
    try {
      if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
      if (AC && AC.state === 'suspended') AC.resume();
    } catch (e) {}
  }
  function beep(f, d, v, type) {
    if (!S.sound || !AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v || 0.05, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, 0.4, 0.07, 'triangle'); }, i * 130); }); }
  $('btnSound').addEventListener('click', function () {
    S.sound = !S.sound;
    this.setAttribute('aria-pressed', String(S.sound));
    this.textContent = S.sound ? 'Sonido activado' : 'Sin sonido';
    initAudio();
  });

  /* Confeti */
  var fx = $('fx'), fctx = fx.getContext('2d');
  function confetti() {
    if (reduce) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
    var colors = ['#ffe500', '#121212', '#ffffff', '#ffc400', '#fff27a'];
    var P = [];
    for (var i = 0; i < 150; i++) P.push({
      x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45,
      vx: (Math.random() - .5) * 15, vy: -Math.random() * 16 - 4,
      s: 6 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      c: colors[(Math.random() * colors.length) | 0]
    });
    var t0 = performance.now();
    (function frame(t) {
      fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fctx.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(function (p) {
        p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
        fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c;
        fctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); fctx.restore();
      });
      if (t - t0 < 3200) requestAnimationFrame(frame); else fctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }

  /* Sorteo */
  function remaining() {
    var won = {}; S.winners.forEach(function (w) { won[w.n] = true; });
    return S.pool.filter(function (p) { return !won[p.n]; });
  }
  function roleLabel(k) {
    if (k < S.nWin) return S.nWin > 1 ? 'Ganador/a ' + (k + 1) + ' de ' + S.nWin : 'Ganador/a';
    var j = k - S.nWin + 1;
    return S.nSub > 1 ? 'Suplente ' + j + ' de ' + S.nSub : 'Suplente';
  }
  function draw() {
    if (S.running) return;
    var rem = remaining(); if (!rem.length) return;
    var winner = rem[randInt(rem.length)];
    S.running = true; updateButton(); initAudio();
    $('reveal').hidden = true; $('stage').classList.remove('won');

    var T = reduce ? 10 : 46 + randInt(6);
    var W = T + 2, L = T + 5, seq = [];
    function pickNear(prev, avoidW) {
      var it, g = 0;
      do { it = rem[randInt(rem.length)]; g++; }
      while (g < 30 && rem.length > 1 && (it === prev || (avoidW && it === winner)));
      return it;
    }
    for (var i = 0; i < L; i++) seq.push(i === W ? winner : pickNear(seq[i - 1], Math.abs(i - W) <= 2));
    setRows(seq.slice(0, 5));

    var c = 0;
    function delay(n) { return reduce ? 180 : 40 + Math.pow(n / T, 3.2) * 420; }
    function step() {
      c++;
      var ctr = 2 + c, dt = delay(c);
      setRows(seq.slice(ctr - 2, ctr + 3));
      if (!reduce && rowsEl.animate) {
        rowsEl.animate([{ transform: 'translateY(' + ROW + 'px)' }, { transform: 'translateY(0)' }], { duration: Math.min(dt * .85, 200), easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
      beep(480 + (c / T) * 520, 0.05, 0.035, 'square');
      if (c >= T) finish(); else setTimeout(step, dt);
    }
    function finish() {
      $('stage').classList.add('won');
      fanfare(); confetti();
      setTimeout(function () { reveal(winner); }, reduce ? 0 : 900);
    }
    setTimeout(step, 60);
  }
  function reveal(w) {
    var k = S.winners.length, role = roleLabel(k);
    S.winners.push(w);
    $('rTag').textContent = role;
    $('rName').textContent = w.user ? '@' + w.user : 'Participante #' + w.n;
    $('rText').textContent = w.text ? '“' + w.text + '”' : '';
    $('rReel').textContent = S.reel ? 'Reel ' + S.reel : '';
    $('reveal').hidden = false;

    var item = document.createElement('div'); item.className = 'log-item';
    var lt = document.createElement('span'); lt.className = 'lt'; lt.textContent = role;
    var ln = document.createElement('span'); ln.className = 'ln'; ln.textContent = w.user ? '@' + w.user : 'Participante #' + w.n;
    item.appendChild(lt); item.appendChild(ln);
    $('winLog').appendChild(item);

    S.running = false; updateButton();
  }
  $('btnDraw').addEventListener('click', function () {
    if (this.dataset.mode === 'reset') newRaffle(); else draw();
  });

  idleState(); updateButton();
})();
</script>

</body></html>
